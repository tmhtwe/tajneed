<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Layout concept: a search-engine-style landing — a big centered search box
     and button is the whole page until someone searches or picks a filter;
     results then appear as a list below, with a small live counter always
     visible above. This keeps the screen calm for a volunteer officer moving
     fast through a line of people, instead of dumping 167 rows up front.
     The report view lives on its own unlisted page (report.html). */
  :root{
    --paper:#FAF7F1; --card:#FFFFFF; --line:#E4DFD2;
    --ink:#1D2A26; --ink-soft:#5C6B65;
    --teal:#163B3F; --teal-2:#2C6E75;
    --gold:#B98D3E; --clay:#B5654B;
    --good:#3E7A52; --good-soft:#E1EFE4;
    --pending:#8A8375; --pending-soft:#EFEBE0;
    --shadow: 0 1px 2px rgba(22,59,63,0.06), 0 6px 20px rgba(22,59,63,0.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#10171A; --card:#182226; --line:#28352F;
      --ink:#ECEEEA; --ink-soft:#A9B5AE;
      --teal:#1E4A4F; --teal-2:#3E8A91;
      --gold:#D3A75C; --clay:#D68870;
      --good:#6FBF8B; --good-soft:#1B2A20;
      --pending:#93998F; --pending-soft:#232922;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#10171A; --card:#182226; --line:#28352F;
    --ink:#ECEEEA; --ink-soft:#A9B5AE;
    --teal:#1E4A4F; --teal-2:#3E8A91;
    --gold:#D3A75C; --clay:#D68870;
    --good:#6FBF8B; --good-soft:#1B2A20;
    --pending:#93998F; --pending-soft:#232922;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.4);
    color-scheme: dark;
  }
  *{box-sizing:border-box; min-width:0;}
  body{margin:0; padding-inline:16px; background:var(--paper); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif; font-size:15px;}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif; margin:0; font-weight:600; letter-spacing:-0.01em; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
  .wrap{max-width:760px; margin:0 auto;}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  header{padding-block:20px 6px; text-align:center;}
  header h1{font-size:1.5rem; color:var(--teal);}
  header .sub{margin-top:5px; font-size:0.86rem; color:var(--ink-soft);}
  header .sub b{color:var(--ink);}

  /* ---------- Live counter (always visible, small) ---------- */
  .countbar{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:9px 14px; box-shadow:var(--shadow); margin:14px auto 0; max-width:420px;}
  .countbar .num{font-family:'Fraunces',serif; font-size:1.15rem; font-weight:600; color:var(--good);}
  .countbar .of{color:var(--ink-soft); font-size:0.82rem;}
  .countbar .bartrack{flex:1; height:6px; background:var(--line); border-radius:99px; overflow:hidden; min-width:50px;}
  .countbar .barfill{height:100%; background:var(--good); border-radius:99px; transition:width .3s ease;}
  .countbar .pct{font-size:0.78rem; color:var(--ink-soft); font-weight:600; min-width:2.4em; text-align:right;}

  /* ---------- Search-engine-style hero ---------- */
  .herosearch{display:flex; flex-direction:column; align-items:center; padding-block:34px 6px; transition:padding .2s ease;}
  .herosearch.compact{padding-block:16px 4px;}
  .herosearch .prompt{font-size:0.92rem; color:var(--ink-soft); margin-bottom:16px; text-align:center;}
  .herosearch.compact .prompt{display:none;}
  .searchrow{display:flex; gap:8px; width:100%; max-width:480px;}
  .searchrow input[type=search]{flex:1; min-width:0; padding:15px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--ink); font-size:1.02rem; box-shadow:var(--shadow);}
  .searchrow input[type=search]::placeholder{color:var(--ink-soft);}
  .searchbtn{flex-shrink:0; background:var(--teal); color:#F4F1E8; border:none; border-radius:999px;
    padding:0 22px; font-weight:600; font-size:0.92rem; cursor:pointer; box-shadow:var(--shadow);}
  .searchbtn:active{transform:scale(0.97);}

  .filterrow{display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center;
    max-width:480px; margin:14px auto 0;}
  select{padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:0.85rem;}
  .chip{border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:0.82rem; font-weight:600;
    padding:7px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;}
  .chip.active{background:var(--teal); border-color:var(--teal); color:#F4F1E8;}
  .filter-scroll{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;}

  /* ---------- Empty / landing state ---------- */
  .landing{text-align:center; color:var(--ink-soft); padding:36px 16px 16px; font-size:0.88rem;}
  .landing .icon{font-size:1.6rem; margin-bottom:8px; opacity:0.6;}

  /* ---------- Roster list ---------- */
  #rosterCount{font-size:0.8rem; color:var(--ink-soft); margin:16px 2px 8px;}
  .roster{display:flex; flex-direction:column; gap:8px; padding-bottom:28px;}
  .row{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; box-shadow:var(--shadow);}
  .row.present{border-color:var(--good); background:var(--good-soft);}
  .row .code{font-size:0.78rem; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line);
    border-radius:6px; padding:2px 7px; flex-shrink:0;}
  .row.present .code{background:var(--card);}
  .row .who{flex:1; min-width:0;}
  .row .who .name{font-weight:600; font-size:0.95rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .who .meta{font-size:0.78rem; color:var(--ink-soft); margin-top:1px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .row .who .meta .saff-a{color:var(--gold); font-weight:600;}
  .row .who .meta .saff-d{color:var(--clay); font-weight:600;}
  .row .who .meta .musi-tag{color:var(--good); font-weight:600;}
  .row .at{font-size:0.72rem; color:var(--ink-soft); flex-shrink:0; text-align:right; display:none;}
  .row.present .at{display:block;}
  .markbtn{flex-shrink:0; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    font-weight:600; font-size:0.82rem; padding:9px 14px; border-radius:8px; cursor:pointer; transition:transform .1s;}
  .markbtn:active{transform:scale(0.96);}
  .row.present .markbtn{background:var(--good); border-color:var(--good); color:#fff;}
  .emptystate{text-align:center; color:var(--ink-soft); padding:40px 16px; font-size:0.9rem;}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper);
    padding:10px 18px; border-radius:8px; font-size:0.85rem; box-shadow:var(--shadow); opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:20;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  [hidden]{display:none!important;}
  @media (max-width:480px){
    header h1{font-size:1.3rem;}
    .herosearch{padding-block:22px 4px;}
    .searchrow input[type=search]{padding:13px 16px; font-size:0.95rem;}
    .searchbtn{padding:0 16px; font-size:0.86rem;}
    .row{padding:9px 10px; gap:8px;}
    .row .code{font-size:0.72rem; padding:2px 5px;}
    .markbtn{padding:8px 10px; font-size:0.76rem;}
  }
</style>

<div class="wrap">
  <header>
    <h1>Ijtema Registration</h1>
    <div class="sub">Regional Ijtema — Upper North Island<br><b>Auckland Majalis &amp; Waikato</b> · 10 October 2026</div>
  </header>

  <div class="countbar">
    <div class="num" id="cbNum">—</div>
    <div class="of">of <span id="cbTotal">—</span> checked in</div>
    <div class="bartrack"><div class="barfill" id="cbFill" style="width:0%"></div></div>
    <div class="pct" id="cbPct">—</div>
  </div>

  <div id="registerView">
    <div class="herosearch" id="herosearch">
      <div class="prompt">Search a Tajneed code or name to check someone in</div>
      <form class="searchrow" id="searchForm">
        <input type="search" id="search" placeholder="Search Tajneed code or name…" autocomplete="off">
        <button type="submit" class="searchbtn">Search</button>
      </form>
      <div class="filterrow">
        <select id="filterMajlis"><option value="">Or browse by Majlis</option></select>
        <div class="filter-scroll" id="statusChips">
          <button class="chip" data-status="pending">Not yet</button>
          <button class="chip" data-status="present">Checked in</button>
        </div>
      </div>
    </div>
    <div id="rosterCount"></div>
    <div class="roster" id="roster"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

,"n":"Sadiq Ahmad Syed","m":"Te Irirangi","s":"A","u":1},{"c":1223,"n":"Saijad Ali Maqbool","m":"Manukau","s":"D","u":0},{"c":1595,"n":"Salman Ahmad","m":"Waikato","s":"D","u":1},{"c":2600,"n":"Salman Razi Syed Bokhari","m":"Te Irirangi","s":"D","u":1},{"c":1620,"n":"Sami Ur-Rehman Khan Lodhi","m":"Waikato","s":"D","u":0},{"c":1271,"n":"Sanjiwa (Ataul Haq) Rajan Reddy","m":"Papakura","s":"D","u":0},{"c":1075,"n":"Saqib Ahmad","m":"Papakura","s":"D","u":0},{"c":1210,"n":"Sarfraz Usman Usman Khan","m":"Manurewa","s":"D","u":0},{"c":1264,"n":"Shafiq ur Rehman","m":"Manurewa","s":"D","u":1},{"c":2565,"n":"Shahid Ahmad","m":"Manurewa","s":"A","u":0},{"c":2223,"n":"Shahid Pervaiz","m":"Manukau","s":"D","u":1},{"c":1712,"n":"Shahzada Mahmood","m":"Waikato","s":"D","u":0},{"c":1234,"n":"Shameem Mohammed","m":"Manukau","s":"D","u":0},{"c":1113,"n":"Shanil Ahmad","m":"Whau","s":"D","u":0},{"c":1021,"n":"Sharif Ahmed","m":"Whau","s":"A","u":1},{"c":1015,"n":"Sheikhil Ahmed Khan","m":"Te Irirangi","s":"A","u":0},{"c":1587,"n":"Sheraz Ahmed Loun","m":"Whau","s":"D","u":0},{"c":1056,"n":"Shiraaz Haroon Shah","m":"Te Irirangi","s":"D","u":0},{"c":2228,"n":"Shoaib Ahmed","m":"Manurewa","s":"D","u":0},{"c":1142,"n":"Sultan Sikander Cheema","m":"Te Irirangi","s":"D","u":0},{"c":1657,"n":"Syed Naj-Mus-Sahar Sabzwari","m":"Whau","s":"D","u":0},{"c":1386,"n":"Syed Sohail Ahmed","m":"Waikato","s":"D","u":0},{"c":2578,"n":"Syed Zahid Shah","m":"Waikato","s":"D","u":0},{"c":1471,"n":"Tahir Ahmad","m":"Manurewa","s":"D","u":1},{"c":2176,"n":"Tahir Ahmad","m":"Manukau","s":"D","u":0},{"c":1786,"n":"Tahir Latif","m":"Te Irirangi","s":"D","u":0},{"c":1244,"n":"Taj Mohammed","m":"Whau","s":"A","u":0},{"c":2339,"n":"Taofeek Sanyaolu","m":"Whau","s":"D","u":1},{"c":1330,"n":"Tasawwar Ahmad Chaudhry","m":"Waikato","s":"D","u":0},{"c":2445,"n":"Tasleem Ahmad Shah","m":"Manukau","s":"D","u":0},{"c":2334,"n":"Taswar Iqbal","m":"Manurewa","s":"D","u":1},{"c":1235,"n":"Tayeen Mohammad","m":"Manukau","s":"A","u":0},{"c":1062,"n":"Thahir Ahmed Mohamed Zafarulla","m":"Te Irirangi","s":"D","u":0},{"c":2320,"n":"Tin Maung Htwe Nasir Ahmad","m":"Te Irirangi","s":"D","u":1},{"c":1804,"n":"Waheed Ahmed Gujjar","m":"Waikato","s":"D","u":1},{"c":1499,"n":"Yousuf Musa Ahmad","m":"Manukau","s":"A","u":0},{"c":1017,"n":"Yunus Ahmad Hamid Hanif","m":"Whau","s":"D","u":1},{"c":1574,"n":"Zaheer Ahmad Khan","m":"Te Irirangi","s":"D","u":0},{"c":1708,"n":"Zahid Tanveer","m":"Manurewa","s":"A","u":0},{"c":1212,"n":"Zainal Aiyaz Khan","m":"Manurewa","s":"D","u":0},{"c":1507,"n":"Zulfiqar Ahmed","m":"Whau","s":"D","u":0}];
  var MAJLIS_ORDER = ["Whau","Manukau","Manurewa","Te Irirangi","Papakura","Waikato"];
  var TOTAL = ROSTER.length;

  var byCode = {};
  ROSTER.forEach(function(m){ byCode[m.c] = m; });

  var checkins = {}; // code -> {present, at, byId}
  var dbApi = null, userApi = null;
  var profileCache = {};

  // ---------- Google Sheets fallback (used when window.claude/db is unavailable,
  // e.g. when this file is hosted on GitHub Pages instead of opened via the
  // Claude artifact link). Paste your deployed Apps Script /exec URL and the
  // same TOKEN you set in the script below.
  var SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxZPAddOC65PaRFOh4Cqc45n1R_3RIM3kwX0j5tD6U6FZ4HrnfV1-ft53i-cAutW-4/exec';
  var SHEETS_TOKEN = 'ijtema2026-north';
  var sheetsMode = false;
  var sheetsPollTimer = null;

  var sheetsSync = {
    start: function(){
      sheetsMode = true;
      sheetsSync.poll();
      sheetsPollTimer = setInterval(sheetsSync.poll, 4000);
    },
    poll: function(){
      if(!SHEETS_URL) return;
      fetch(SHEETS_URL + '?token=' + encodeURIComponent(SHEETS_TOKEN), { method: 'GET' })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if(!res || !res.ok) return;
          checkins = res.data || {};
          renderAll();
        })
        .catch(function(){ /* transient network issue; next poll retries */ });
    },
    write: function(code, present){
      if(!SHEETS_URL){ showToast('Attendance saving is not set up yet'); return; }
      var body = {
        token: SHEETS_TOKEN,
        action: present ? 'set' : 'delete',
        code: String(code),
        present: present,
        at: new Date().toISOString()
      };
      // optimistic local update so the UI feels instant
      if(present){ checkins[code] = { present: true, at: body.at }; }
      else { delete checkins[code]; }
      renderAll();
      fetch(SHEETS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight
        body: JSON.stringify(body)
      }).then(function(r){ return r.json(); })
        .then(function(res){
          if(res && res.ok && res.data){ checkins = res.data; renderAll(); }
          else { showToast('Could not save — check connection and try again'); }
        })
        .catch(function(){ showToast('Could not save — check connection and try again'); });
    }
  };

  var els = {
    herosearch: document.getElementById('herosearch'),
    searchForm: document.getElementById('searchForm'),
    search: document.getElementById('search'),
    filterMajlis: document.getElementById('filterMajlis'),
    statusChips: document.getElementById('statusChips'),
    roster: document.getElementById('roster'),
    rosterCount: document.getElementById('rosterCount'),
    cbNum: document.getElementById('cbNum'),
    cbTotal: document.getElementById('cbTotal'),
    cbFill: document.getElementById('cbFill'),
    cbPct: document.getElementById('cbPct'),
    toast: document.getElementById('toast')
  };

  var state = { q:'', majlis:'', status:'' };

  function hasActiveFilter(){
    return !!(state.q || state.majlis || state.status);
  }

  // ---------- Populate Majlis filter ----------
  MAJLIS_ORDER.forEach(function(mj){
    var opt = document.createElement('option');
    opt.value = mj; opt.textContent = mj;
    els.filterMajlis.appendChild(opt);
  });

  // ---------- Search / filter wiring ----------
  els.search.addEventListener('input', function(){ state.q = els.search.value.trim().toLowerCase(); renderRoster(); });
  els.searchForm.addEventListener('submit', function(e){
    e.preventDefault();
    state.q = els.search.value.trim().toLowerCase();
    renderRoster();
  });
  els.filterMajlis.addEventListener('change', function(){ state.majlis = els.filterMajlis.value; renderRoster(); });
  els.statusChips.addEventListener('click', function(e){
    var btn = e.target.closest('.chip'); if(!btn) return;
    var wasActive = btn.classList.contains('active');
    els.statusChips.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
    if(wasActive){
      state.status = '';
    } else {
      state.status = btn.dataset.status;
      btn.classList.add('active');
    }
    renderRoster();
  });

  function matches(m){
    if(state.majlis && m.m !== state.majlis) return false;
    var ci = checkins[m.c];
    var present = !!(ci && ci.present);
    if(state.status === 'pending' && present) return false;
    if(state.status === 'present' && !present) return false;
    if(state.q){
      var hay = (String(m.c) + ' ' + m.n).toLowerCase();
      if(hay.indexOf(state.q) === -1) return false;
    }
    return true;
  }

  function fmtTime(iso){
    try{
      var d = new Date(iso);
      return d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'});
    }catch(e){ return ''; }
  }

  function saffLabel(m){
    return m.s === 'A' ? '<span class="saff-a">Saff-e-Awwal</span>' : '<span class="saff-d">Saff-e-Dom</span>';
  }

  // ---------- Render roster ----------
  function renderRoster(){
    var active = hasActiveFilter();
    els.herosearch.classList.toggle('compact', active);
    if(!active){
      els.rosterCount.textContent = '';
      els.roster.innerHTML = '<div class="landing"><div class="icon">🔍</div>Search or pick a filter above to see people here.</div>';
      return;
    }
    var rows = ROSTER.filter(matches);
    els.rosterCount.textContent = rows.length + ' of ' + TOTAL + ' shown';
    if(!rows.length){
      els.roster.innerHTML = '<div class="emptystate">No one matches this search / filter.</div>';
    } else {
      els.roster.innerHTML = rows.map(function(m){
        var ci = checkins[m.c];
        var present = !!(ci && ci.present);
        var musi = m.u ? ' · <span class="musi-tag">Musi</span>' : '';
        return '<div class="row' + (present?' present':'') + '" data-code="' + m.c + '">' +
          '<div class="code mono">' + m.c + '</div>' +
          '<div class="who"><div class="name"></div><div class="meta">' + m.m + ' · ' + saffLabel(m) + musi + '</div></div>' +
          '<div class="at">' + (ci && ci.at ? fmtTime(ci.at) : '') + '</div>' +
          '<button class="markbtn" data-code="' + m.c + '">' + (present ? 'Present ✓' : 'Mark present') + '</button>' +
        '</div>';
      }).join('');
      // set names via textContent (never innerHTML) to keep user-entered-shaped data safe
      var nameEls = els.roster.querySelectorAll('.row');
      nameEls.forEach(function(rowEl){
        var code = rowEl.dataset.code;
        var m = byCode[code];
        rowEl.querySelector('.name').textContent = m.n;
      });
    }
  }

  els.roster.addEventListener('click', function(e){
    var btn = e.target.closest('.markbtn'); if(!btn) return;
    toggleCheckin(btn.dataset.code);
  });

  function toggleCheckin(code){
    var ci = checkins[code];
    var present = !!(ci && ci.present);

    if(sheetsMode){
      sheetsSync.write(code, !present);
      return;
    }

    if(!dbApi){ showToast('Not connected yet — try again in a moment'); return; }
    var ref = dbApi.collection('checkins').doc(String(code));
    if(present){
      ref.delete().catch(function(){ showToast('Could not undo — try again'); });
    } else {
      var body = { present:true, at: new Date().toISOString() };
      (userApi ? userApi.id() : Promise.resolve(null)).then(function(uid){
        if(uid) body.byId = uid;
        return ref.set(body);
      }).catch(function(){ showToast('Could not save — check connection and try again'); });
    }
  }

  var toastTimer = null;
  function showToast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ els.toast.classList.remove('show'); }, 2400);
  }

  // ---------- Live counters ----------
  function renderCounters(){
    var present = 0;
    ROSTER.forEach(function(m){ if(checkins[m.c] && checkins[m.c].present) present++; });
    els.cbNum.textContent = present;
    els.cbTotal.textContent = TOTAL;
    var p = TOTAL ? (present/TOTAL*100) : 0;
    els.cbFill.style.width = p + '%';
    els.cbPct.textContent = Math.round(p) + '%';
  }

  function renderAll(){
    renderCounters();
    renderRoster();
  }

  // ---------- Capability wiring ----------
  function boot(){
    renderAll();
    if(!window.claude || !window.claude.use){
      // Not opened via the Claude artifact link (e.g. hosted on GitHub Pages) —
      // fall back to the Google Sheets backend if one has been configured.
      if(SHEETS_URL){ sheetsSync.start(); }
      else { showToast('Attendance saving is not set up on this hosted copy yet'); }
      return;
    }
    window.claude.use('db').then(function(db){
      dbApi = db;
      if(!db) return;
      db.collection('checkins').onSnapshot(function(snap){
        var next = {};
        snap.docs.forEach(function(doc){
          var data = doc.data();
          if(data) next[doc.id] = data;
        });
        checkins = next;
        renderAll();
      }, function(err){
        showToast('Live sync lost (' + (err && err.code || 'error') + ') — reload to reconnect');
      });
    });
    window.claude.use('user').then(function(u){ userApi = u; });
  }

  if(window.claude && window.claude.hot){
    window.claude.hot.ready ? window.claude.hot.ready(boot) : boot();
  } else {
    boot();
  }
})();
</script>
